name: Build and Release Windroid RootFS

on:
  push:
    branches: "*"
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

    - name: "Install ArchLinux"
      run: |
        sudo apt update
        sudo apt install -y arch-install-scripts wget
        sudo mkdir -p /mnt/

        wget https://geo.mirror.pkgbuild.com/iso/latest/archlinux-bootstrap-x86_64.tar.zst

        sudo tar -xf archlinux-bootstrap-x86_64.tar.zst
        sudo rm -f archlinux-bootstrap-x86_64.tar.zst
        sudo mv root.x86_64 /mnt/arch

        sudo arch-chroot /mnt/arch bash -c "pacman-key --init && pacman-key --populate && sed -i "s/#Server/Server/g" /etc/pacman.d/mirrorlist && sed -i "s/CheckSpace/#CheckSpace/g" /etc/pacman.conf && pacman -Syu --noconfirm base base-devel git cmake meson ninja bison flex python-pip wget python-mako python-pyyaml unzip 7zip glslang glib2-devel python-docutils xmlto fop libxslt python-docutils"

    - name: "Checkout Repository"
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: "Copy Repository to Chroot"
      run: |
        sudo cp -rf $PWD /mnt/arch/Windroid-RootFS-Generator

    - name: "Download and Extract Latest RootFS for Cache"
      run: |
        LATEST_TAG=$(curl -s https://api.github.com/repos/KreitinnSoftware/Windroid-RootFS-Generator/releases | grep tag_name -m 1 | cut -d ":" -f 2 | sed "s/\"//g" | sed "s/,//g" | sed "s/ //g")
        if [ -n "$LATEST_TAG" ]; then
          # Try to download RootFS for both architectures and extract packages
          for arch in x86_64 aarch64; do
            ROOTFS_URL="https://github.com/KreitinnSoftware/Windroid-RootFS-Generator/releases/download/$LATEST_TAG/Windroid-RootFS-$LATEST_TAG-$arch.rat"
            echo "Trying to download: $ROOTFS_URL"
            curl -fLO# "$ROOTFS_URL" || continue
            if [ -f "Windroid-RootFS-$LATEST_TAG-$arch.rat" ]; then
              echo "Extracting packages from RootFS for $arch..."
              sudo mkdir -p /mnt/arch/Windroid-RootFS-Generator/built-pkgs
              # Make our script executable and use it
              sudo chmod +x /mnt/arch/Windroid-RootFS-Generator/tools/extract-packages-from-rootfs.sh
              sudo /mnt/arch/Windroid-RootFS-Generator/tools/extract-packages-from-rootfs.sh \
                "Windroid-RootFS-$LATEST_TAG-$arch.rat" \
                "/mnt/arch/Windroid-RootFS-Generator/built-pkgs"
              rm -f "Windroid-RootFS-$LATEST_TAG-$arch.rat"
            fi
          done
        fi
        # Also try Windroid-Packages.zip as fallback
        curl -LO# https://github.com/KreitinnSoftware/Windroid-RootFS-Generator/releases/download/$LATEST_TAG/Windroid-Packages.zip || true
        sudo unzip -o Windroid-Packages.zip -d /mnt/arch/Windroid-RootFS-Generator/built-pkgs || true
        rm -f Windroid-Packages.zip

    - name: "Setup Basic Android (x86_64) Runtime Environment (Required for Building x86_64 glib)"
      run: |
        git clone https://github.com/termux/termux-docker.git
        cd termux-docker
        git checkout 148b93d989cbc572719e050135b3e13f115f2a8e^
        cd ..
        sudo cp -rf termux-docker/system/x86 /mnt/arch/system
        sudo chown -R $(whoami):$(whoami) /mnt/arch/system
        sudo chmod 755 -R /mnt/arch/system

    - name: "Start Building (x86_64)"
      run: |
        sudo arch-chroot /mnt/arch bash -c "cd /Windroid-RootFS-Generator && ./build-all.sh x86_64 --ci && cd logs && 7z a /Windroid-RootFS-$(git rev-parse --short HEAD)-x86_64-Logs.zip"

    - name: "Create RootFS File (x86_64)"
      run: |
        sudo arch-chroot /mnt/arch bash -c "cd /Windroid-RootFS-Generator && ./create-rootfs-rat.sh x86_64 && mv Windroid-RootFS-\($(git rev-parse --short HEAD)\)-x86_64.rat /Windroid-RootFS-$(git rev-parse --short HEAD)-x86_64.rat"

    - name: "Clean (x86_64) RootFS"
      run: |
        sudo rm -rf /mnt/arch/data /mnt/arch/Windroid-RootFS-Generator/workdir /mnt/arch/Windroid-RootFS-Generator/rootfs

    - name: "Start Building (aarch64)"
      run: |
        sudo arch-chroot /mnt/arch bash -c "cd /Windroid-RootFS-Generator && ./build-all.sh aarch64 --ci && cd logs && 7z a /Windroid-RootFS-$(git rev-parse --short HEAD)-aarch64-Logs.zip"

    - name: "Create RootFS File (aarch64)"
      run: |
        sudo arch-chroot /mnt/arch bash -c "cd /Windroid-RootFS-Generator && ./create-rootfs-rat.sh aarch64 && mv Windroid-RootFS-\($(git rev-parse --short HEAD)\)-aarch64.rat /Windroid-RootFS-$(git rev-parse --short HEAD)-aarch64.rat"

    - name: "Save Rat Packages"
      run: |
        sudo arch-chroot /mnt/arch bash -c "cd /Windroid-RootFS-Generator/built-pkgs && 7z a /Windroid-Packages.zip"

    - name: "Get Short SHA"
      run: |
        echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

    - name: "Create Release"
      uses: softprops/action-gh-release@v1
      with:
        name: "Windroid RootFS (${{ env.SHORT_SHA }})"
        tag_name: ${{ env.SHORT_SHA }}
        prerelease: true
        files: |
          /mnt/arch/*.rat
          /mnt/arch/*.zip
